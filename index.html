<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Social Media</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone-frame">
<div class="phone-screen">

<!-- Cabeçalho do Post -->
<div class="post-header">
<div class="user-info">
<img class="avatar-small" src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcSfeHmu3RJuKL3ZftvV0L3f6pubR5bIMX6rf1x7v99iue86lt2u" alt="Avatar">
<span class="username">Barmy</span>
</div>
<div class="more-options">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
<circle cx="5" cy="12" r="2" />
<circle cx="12" cy="12" r="2" />
<circle cx="19" cy="12" r="2" />
</svg>
</div>
</div>

<!-- Mídia Principal -->
<div class="post-media">
<video class="main-img" src="snapinsta-1787355445600.mp4" controls autoplay loop></video>
<!-- Sticker/Badge sobreposto na foto -->
<div class="user-badge">
<img src="images (1).jpeg" alt="user">
<div class="plus-icon">+</div>
</div>
</div>

<!-- Barra de Interações -->
<div class="post-actions">
  <div class="left-actions">
    <!-- Curtir -->
    <button class="action-btn">
      <svg viewBox="0 0 24 24">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      259M
    </button>

    <!-- Comentar -->
    <button class="action-btn">
      <svg viewBox="0 0 24 24">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8.3z"></path>
      </svg>
      12,9K
    </button>

    <!-- Repostar -->
    <button class="action-btn">
      <svg viewBox="0 0 24 24">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
      196K
    </button>

    <!-- Aviãozinho / Enviar -->
    <button class="action-btn">
      <svg viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <!-- Salvar (Bookmark) no lado direito -->
  <button class="action-btn">
    <svg viewBox="0 0 24 24">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>
</div> <!-- Fecha post-actions -->
  

<!-- Detalhes / Curtidas -->
<div class="post-details">
  <div class="liked-by-section">
    <div class="liked-by-avatars">
      <img src="images (1).jpeg" alt="Avatar 1">
      <img src="images (3).jpeg" alt="Avatar 2">
      <img src="Screenshot_20260822-170457_Google.jpg" alt="Avatar 3">
    </div>
    <p class="likes-text">Liked by <strong>mnijungkook, rkive </strong> and <strong>259M others</strong></p>
  </div>
</div>

<!-- Navegação Inferior -->
<div class="nav-bar">
  <div class="nav-item">
  
<svg viewBox="0 0 24 24">
<circle cx="11" cy="11" r="8"></circle>
<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
</svg>
</div>
<div class="nav-item">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
<line x1="12" y1="8" x2="12" y2="16"></line>
<line x1="8" y1="12" x2="16" y2="12"></line>
</svg>
</div>
<div class="nav-item">
<svg viewBox="0 0 24 24">
<polygon points="23 7 16 12 23 17 23 7"></polygon>
<rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
</svg>
</div>
<div class="nav-item">
<svg viewBox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
</div>

</div>
</div>

</body>

  </html>
